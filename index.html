<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇲🇹 Μάλτα 2026: Dousis Ultimate Guide</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fdf6e3; color: #2c3e50; margin: 0; padding-bottom: 60px; }
        
        .header { background: #fff; position: sticky; top: 0; z-index: 900; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 10px 0; border-bottom: 3px solid #d35400; }
        h1 { text-align: center; color: #2c3e50; margin: 5px 0; font-size: 1.3rem; font-family: "Georgia", serif; }
        
        .filters-wrapper { display: flex; flex-direction: column; gap: 8px; margin-top: 5px; }
        .scroll-container { display: flex; overflow-x: auto; gap: 8px; padding: 0 15px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .scroll-container::-webkit-scrollbar { display: none; }
        
        .btn-filter { flex: 0 0 auto; padding: 8px 15px; border-radius: 20px; border: 1px solid #d35400; background: #fff; font-size: 0.85rem; color: #555; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .btn-filter.active { background: #d35400; color: white; border-color: #d35400; }
        .date-btn.active { background: #2c3e50; border-color: #2c3e50; }

        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        .card { background: white; border-radius: 4px; padding: 15px; margin-bottom: 15px; border-left: 5px solid #d35400; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
        
        .category-tag { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #d35400; letter-spacing: 1px; }
        .name { font-size: 1.3rem; font-weight: 800; margin: 5px 0; color: #2c3e50; font-family: "Georgia", serif; }
        
        .distance-tag { font-size: 0.9rem; color: #555; display: block; margin-bottom: 5px; background: #eee; padding: 3px 8px; border-radius: 4px; width: fit-content; }
        
        .meta-info { display: flex; gap: 10px; margin-top: 8px; font-size: 0.9rem; }
        .time-badge { background: #2c3e50; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
        .cost-badge { background: #eafaf1; color: #27ae60; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
        
        .tip { background: #fcf3cf; color: #555; padding: 10px; border-radius: 4px; margin-top: 10px; font-style: italic; font-size: 0.95rem; border-left: 3px solid #f1c40f; }

        .card-actions { display: flex; gap: 10px; margin-top: 15px; }
        .action-btn { flex: 1; padding: 12px; border-radius: 4px; text-align: center; font-weight: bold; text-decoration: none; font-size: 0.9rem; cursor: pointer; border: none; text-transform: uppercase; letter-spacing: 0.5px; }
        .map-btn { background: white; color: #2c3e50; border: 1px solid #2c3e50; }
        .info-btn { background: #2c3e50; color: white; display: flex; align-items: center; justify-content: center; gap: 5px; }

        /* MODAL */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; align-items: flex-end; justify-content: center; }
        .modal-content { background: white; width: 100%; max-width: 600px; border-radius: 15px 15px 0 0; padding: 25px; max-height: 85vh; overflow-y: auto; animation: slideUp 0.3s ease-out; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .modal-title { font-size: 1.4rem; font-weight: bold; color: #2c3e50; margin: 0; font-family: "Georgia", serif; }
        .close-btn { background: none; border: none; font-size: 2rem; color: #888; cursor: pointer; }
        .modal-body { font-size: 1.05rem; line-height: 1.6; color: #333; white-space: pre-line; }
        .audio-controls { margin-top: 20px; display: flex; gap: 10px; border-top: 1px solid #eee; padding-top: 15px; }
        .speak-btn { background: #d35400; color: white; width: 100%; border-radius: 8px; padding: 12px; font-weight: bold; border: none; cursor: pointer;}
        .stop-btn { background: #c0392b; color: white; display: none; width: 100%; border-radius: 8px; padding: 12px; font-weight: bold; border: none; cursor: pointer;}
        
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* ── WEATHER WIDGET ── */
        .weather-bar {
            background: linear-gradient(135deg, #1a6fa8 0%, #0e4d7a 100%);
            color: white;
            padding: 0;
            margin: 6px 15px 0;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .weather-current {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 13px;
            cursor: pointer;
            user-select: none;
        }
        .weather-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .weather-icon { font-size: 1.6rem; line-height: 1; }
        .weather-temp {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .weather-desc {
            font-size: 0.75rem;
            opacity: 0.85;
            line-height: 1.2;
        }
        .weather-mid {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.72rem;
            opacity: 0.85;
            gap: 2px;
        }
        .weather-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .weather-refresh {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .weather-refresh:hover { background: rgba(255,255,255,0.3); }
        .weather-refresh.spinning { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .weather-toggle {
            font-size: 0.7rem;
            opacity: 0.7;
            transition: transform 0.3s;
        }
        .weather-toggle.open { transform: rotate(180deg); }

        .weather-forecast {
            display: none;
            border-top: 1px solid rgba(255,255,255,0.15);
            padding: 8px 13px 10px;
        }
        .weather-forecast.open { display: block; }
        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .forecast-day {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 5px 3px;
            border-radius: 7px;
            background: rgba(255,255,255,0.08);
            font-size: 0.68rem;
        }
        .forecast-day.today {
            background: rgba(255,255,255,0.22);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.35);
        }
        .forecast-dayname { font-weight: 700; font-size: 0.62rem; opacity: 0.9; }
        .forecast-date { opacity: 0.65; font-size: 0.6rem; }
        .forecast-icon { font-size: 1.1rem; margin: 2px 0; }
        .forecast-max { font-weight: 800; font-size: 0.75rem; }
        .forecast-min { opacity: 0.65; font-size: 0.62rem; }
        .forecast-rain { font-size: 0.6rem; opacity: 0.75; }
        .weather-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 0.6rem;
            opacity: 0.55;
            padding: 0 1px;
        }
        .weather-error {
            padding: 10px 13px;
            font-size: 0.8rem;
            opacity: 0.75;
            text-align: center;
        }
        .weather-loading {
            padding: 10px 13px;
            font-size: 0.78rem;
            opacity: 0.75;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🇲🇹 Malta 2026: Dousis Guide</h1>

        <!-- WEATHER WIDGET -->
        <div class="weather-bar" id="weatherBar">
            <div class="weather-loading" id="weatherLoading">
                <span>⏳</span> Φόρτωση καιρού St. Julian's…
            </div>
        </div>

        <div class="filters-wrapper">
            <div class="scroll-container">
                <button class="btn-filter date-btn active" onclick="filterData('day', 0)">Όλα</button>
                <button class="btn-filter date-btn" onclick="filterData('day', 1)">Δευ 11/5</button>
                <button class="btn-filter date-btn" onclick="filterData('day', 2)">Τρί 12/5</button>
                <button class="btn-filter date-btn" onclick="filterData('day', 3)">Τετ 13/5</button>
                <button class="btn-filter date-btn" onclick="filterData('day', 4)">Πέμ 14/5</button>
                <button class="btn-filter date-btn" onclick="filterData('day', 5)">Παρ 15/5</button>
                <button class="btn-filter date-btn" onclick="filterData('day', 6)">Σάβ 16/5</button>
                <button class="btn-filter date-btn" onclick="filterData('day', 7)">Κυρ 17/5</button>
            </div>
            <div class="scroll-container">
                <button class="btn-filter active" onclick="filterData('cat', 'all')">Όλα</button>
                <button class="btn-filter" onclick="filterData('cat', 'αξιοθέατα')">🏛️ Αξιοθέατα</button>
                <button class="btn-filter" onclick="filterData('cat', 'φαγητό')">🥪 Φαγητό</button>
                <button class="btn-filter" onclick="filterData('cat', 'ποτό')">🍸 Ποτό</button>
                <button class="btn-filter" onclick="filterData('cat', 'διασκέδαση')">🎶 Διασκέδαση</button>
                <button class="btn-filter" onclick="filterData('cat', 'παραλίες')">🌊 Παραλίες</button>
                <button class="btn-filter" onclick="filterData('cat', 'μεταφορές')">🚌 Μεταφορές</button>
                <button class="btn-filter" onclick="filterData('cat', 'κινηματογράφος')">🎬 Κινηματογράφος</button>
            </div>
        </div>
    </div>

    <div class="container" id="content"></div>

    <div id="infoModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modalTitle" class="modal-title"></h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div id="modalBody" class="modal-body"></div>
            <div class="audio-controls">
                <button id="speakBtn" class="action-btn speak-btn" onclick="startSpeaking()">🔊 Ακρόαση Ξεναγού</button>
                <button id="stopBtn" class="action-btn stop-btn" onclick="stopSpeaking()">⏹️ Σταμάτημα</button>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let currentDisplayData = [];
        let currentDay = 0;
        let currentCat = 'all';
        let currentTextToSpeak = "";
        const synth = window.speechSynthesis;

        // Fetch API για να τραβάει τα δεδομένα από το locations.json
        fetch('locations.json')
            .then(res => res.json())
            .then(data => { allData = data; render(); })
            .catch(err => console.error("Error loading JSON:", err));

        // Συνάρτηση αφαίρεσης τόνων για απροβλημάτιστο φιλτράρισμα στα Ελληνικά
        const removeAccents = (str) => {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        };

        function filterData(type, value) {
            if (type === 'day') {
                currentDay = value;
                document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
            } else {
                currentCat = value;
                document.querySelectorAll('.btn-filter:not(.date-btn)').forEach(b => b.classList.remove('active'));
            }
            event.target.classList.add('active');
            render();
            // Ενημέρωσε τον καιρό για την επιλεγμένη μέρα (αν έχουμε δεδομένα)
            if (type === 'day' && cachedWeatherData) {
                renderWeather(cachedWeatherData, currentDay);
            }
        }

        function render() {
            const container = document.getElementById('content');
            container.innerHTML = '';

            currentDisplayData = allData.filter(item => {
                const dayMatch = currentDay === 0 || (item.days && item.days.includes(currentDay));
                let catMatch = true;
                
                if (currentCat !== 'all') {
                    const itemCatClean = removeAccents(item.category);
                    const searchCatClean = removeAccents(currentCat);
                    catMatch = itemCatClean.includes(searchCatClean);
                }
                
                return dayMatch && catMatch;
            });

            if (currentDisplayData.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:#777;">Κενό Πρόγραμμα! Χαλαρώστε στο St. Julian\'s! 🍹</div>';
                return;
            }

            currentDisplayData.forEach((item, index) => {
                const distanceHtml = item.distance ? `<span class="distance-tag">👣 Από Βάση/Προηγούμενο: <b>${item.distance}</b></span>` : '';
                const searchQuery = encodeURIComponent((item.mapQuery || item.name) + " Malta");
                const realMapUrl = `https://www.google.com/maps/search/?api=1&query=${searchQuery}`;

                container.innerHTML += `
                    <div class="card">
                        <div class="category-tag">${item.category}</div>
                        <div class="name">${item.name}</div>
                        ${distanceHtml}
                        <div class="meta-info">
                            <span class="time-badge">🕒 ${item.time || '-'}</span>
                            <span class="cost-badge">💰 ${item.cost}</span>
                        </div>
                        <div class="tip">💡 ${item.tip}</div>
                        <div class="card-actions">
                            <button class="action-btn info-btn" onclick="openModal(${index})">ℹ️ Πλήρης Ανάλυση</button>
                            <a href="${realMapUrl}" target="_blank" class="action-btn map-btn">📍 Χάρτης</a>
                        </div>
                    </div>
                `;
            });
        }

        function openModal(index) {
            const item = currentDisplayData[index];
            if (!item) return;
            document.getElementById('modalTitle').innerText = item.name;
            document.getElementById('modalBody').innerText = item.description || item.tip;
            
            // Καθαρισμός κειμένου από Emojis και παραπομπές για το σύστημα φωνής
            let cleanText = (item.description || item.tip).replace(/\]+\]/g, '');
            currentTextToSpeak = cleanText.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '');
            
            document.getElementById('infoModal').style.display = 'flex';
            stopSpeaking();
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
            stopSpeaking();
        }

        function startSpeaking() {
            if (synth.speaking) return;
            if (currentTextToSpeak) {
                const utterThis = new SpeechSynthesisUtterance(currentTextToSpeak);
                utterThis.lang = 'el-GR';
                utterThis.rate = 0.95;
                utterThis.onend = () => toggleAudioButtons(false);
                synth.speak(utterThis);
                toggleAudioButtons(true);
            }
        }

        function stopSpeaking() {
            if (synth.speaking) synth.cancel();
            toggleAudioButtons(false);
        }

        function toggleAudioButtons(isSpeaking) {
            document.getElementById('speakBtn').style.display = isSpeaking ? 'none' : 'block';
            document.getElementById('stopBtn').style.display = isSpeaking ? 'block' : 'none';
        }
        /* ════════════════════════════════════════
           WEATHER — Open-Meteo API (no key needed)
           St. Julian's, Malta: 35.9172, 14.4889
           Refresh: κάθε 30 λεπτά
           ════════════════════════════════════════ */

        const WEATHER_LAT   = 35.9172;
        const WEATHER_LON   = 14.4889;
        const REFRESH_MS    = 30 * 60 * 1000; // 30 λεπτά

        // Ημέρες ταξιδιού: 11–17 Μαΐου 2026
        const TRIP_START    = new Date('2026-05-11');
        const TRIP_END      = new Date('2026-05-17');

        const WMO = {
            0:  ['☀️','Καθαρός'],
            1:  ['🌤️','Κυρίως αίθριος'],
            2:  ['⛅','Μερική συννεφιά'],
            3:  ['☁️','Συννεφιά'],
            45: ['🌫️','Ομίχλη'],
            48: ['🌫️','Ομίχλη'],
            51: ['🌦️','Ψιλόβροχο'],
            53: ['🌦️','Ψιλόβροχο'],
            55: ['🌦️','Ψιλόβροχο'],
            61: ['🌧️','Βροχή'],
            63: ['🌧️','Βροχή'],
            65: ['🌧️','Έντονη βροχή'],
            71: ['🌨️','Χιόνι'],
            73: ['🌨️','Χιόνι'],
            75: ['🌨️','Χιονόπτωση'],
            77: ['🌨️','Χαλάζι'],
            80: ['🌧️','Ντους βροχής'],
            81: ['🌧️','Ντους βροχής'],
            82: ['⛈️','Καταρρακτώδης'],
            85: ['🌨️','Χιονόπτωση'],
            86: ['🌨️','Χιονόπτωση'],
            95: ['⛈️','Καταιγίδα'],
            96: ['⛈️','Καταιγίδα+χαλ.'],
            99: ['⛈️','Καταιγίδα+χαλ.']
        };

        const DAYS_GR = ['Κυρ','Δευ','Τρί','Τετ','Πέμ','Παρ','Σάβ'];
        const MONTHS_GR = ['Ιαν','Φεβ','Μαρ','Απρ','Μαϊ','Ιουν','Ιουλ','Αυγ','Σεπ','Οκτ','Νοε','Δεκ'];

        let weatherOpen       = false;
        let refreshTimer      = null;
        let cachedWeatherData = null;

        // Αριθμός ημέρας (1-7) → YYYY-MM-DD (Ημέρα 1 = 11/5, Ημέρα 7 = 17/5)
        function getTripDate(dayNum) {
            if (!dayNum) return null;
            const base = new Date('2026-05-10T12:00:00');
            base.setDate(base.getDate() + dayNum);
            return base.toISOString().slice(0, 10);
        }

        function wmo(code) {
            return WMO[code] || WMO[Math.floor(code / 10) * 10] || ['🌡️','Άγνωστο'];
        }

        function fmtTime(d) {
            return d.toLocaleTimeString('el-GR', { hour: '2-digit', minute: '2-digit' });
        }

        function isTripDay(dateStr) {
            const d = new Date(dateStr);
            return d >= TRIP_START && d <= TRIP_END;
        }

        function tripDayLabel(dateStr) {
            // Returns "Κυρ 11/5" style label
            const d = new Date(dateStr + 'T12:00:00');
            return `${DAYS_GR[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`;
        }

        function showWeatherError(msg) {
            document.getElementById('weatherBar').innerHTML =
                `<div class="weather-current" style="cursor:default">
                    <div class="weather-left">
                        <span class="weather-icon">⚠️</span>
                        <div>
                            <div style="font-size:0.8rem;font-weight:700">Σφάλμα καιρού</div>
                            <div style="font-size:0.65rem;opacity:0.75;max-width:200px;word-break:break-all">${msg}</div>
                        </div>
                    </div>
                    <button class="weather-refresh" onclick="fetchWeather()" title="Retry">🔄</button>
                 </div>`;
        }

        async function fetchWeather() {
            const btn = document.getElementById('weatherRefreshBtn');
            if (btn) btn.classList.add('spinning');

            // Χρησιμοποιούμε URLSearchParams για σωστό encoding — timezone χωρίς %2F
            const params = new URLSearchParams({
                latitude:        WEATHER_LAT,
                longitude:       WEATHER_LON,
                current:         'temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m',
                daily:           'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max',
                timezone:        'Europe/Malta',
                forecast_days:   '16',
                wind_speed_unit: 'kmh'
            });
            const url = 'https://api.open-meteo.com/v1/forecast?' + params.toString();

            try {
                const res = await fetch(url, { mode: 'cors' });
                if (!res.ok) {
                    const txt = await res.text().catch(() => '');
                    throw new Error('HTTP ' + res.status + (txt ? ': ' + txt.slice(0,80) : ''));
                }
                const data = await res.json();

                if (!data.current || !data.daily) {
                    throw new Error(data.reason || 'Μη αναμενόμενη μορφή δεδομένων API');
                }

                cachedWeatherData = data;           // ← αποθήκευση
                renderWeather(data, currentDay);    // ← πέρνα την τρέχουσα ημέρα
            } catch (e) {
                console.error('[Weather]', e);
                showWeatherError(e.message || 'Άγνωστο σφάλμα');
            } finally {
                const b = document.getElementById('weatherRefreshBtn');
                if (b) b.classList.remove('spinning');
            }
        }

        function windDir(deg) {
            if (deg == null) return '';
            const dirs = ['Β','ΒΑ','Α','ΝΑ','Ν','ΝΔ','Δ','ΒΔ'];
            return dirs[Math.round(deg / 45) % 8];
        }

        function renderWeather(data, dayNum) {
            const now      = new Date();
            const todayStr = now.toISOString().slice(0, 10);
            const d        = data.daily  || {};
            const times    = d.time      || [];

            // Ποια ημερομηνία-στόχος;
            const targetDate = getTripDate(dayNum) || todayStr;
            const targetIdx  = times.indexOf(targetDate);

            // ── Αριστερό τμήμα: current (dayNum=0) ή ημερήσια πρόβλεψη ──
            let topHtml = '';

            if (!dayNum) {
                // ── Τρέχουσες συνθήκες ──
                const c        = data.current || {};
                const [icon, desc] = wmo(c.weather_code ?? 0);
                const temp     = c.temperature_2m       != null ? Math.round(c.temperature_2m)       : '—';
                const feels    = c.apparent_temperature != null ? Math.round(c.apparent_temperature) : '—';
                const humidity = c.relative_humidity_2m ?? '—';
                const wind     = c.wind_speed_10m       != null ? Math.round(c.wind_speed_10m)       : '—';
                const wdir     = windDir(c.wind_direction_10m);

                topHtml = `
                    <div class="weather-current" onclick="toggleForecast()">
                        <div class="weather-left">
                            <span class="weather-icon">${icon}</span>
                            <div>
                                <span class="weather-temp">${temp}°C</span>
                                <div class="weather-desc">${desc} · Αίσθηση ${feels}°</div>
                            </div>
                        </div>
                        <div class="weather-mid">
                            <span>💨 ${wind} km/h ${wdir}</span>
                            <span>💧 ${humidity}%</span>
                        </div>
                        <div class="weather-right">
                            <button id="weatherRefreshBtn" class="weather-refresh"
                                    onclick="event.stopPropagation();fetchWeather()" title="Ανανέωση">🔄</button>
                            <span class="weather-toggle ${weatherOpen?'open':''}" id="weatherToggleArrow">▼</span>
                        </div>
                    </div>`;

            } else if (targetIdx >= 0) {
                // ── Πρόβλεψη για συγκεκριμένη μέρα ──
                const [icon, desc] = wmo(d.weather_code?.[targetIdx] ?? 0);
                const max   = d.temperature_2m_max?.[targetIdx]          != null ? Math.round(d.temperature_2m_max[targetIdx])          : '—';
                const min   = d.temperature_2m_min?.[targetIdx]          != null ? Math.round(d.temperature_2m_min[targetIdx])          : '—';
                const rain  = d.precipitation_probability_max?.[targetIdx] ?? 0;
                const wind  = d.wind_speed_10m_max?.[targetIdx]          != null ? Math.round(d.wind_speed_10m_max[targetIdx])          : '—';
                const label = tripDayLabel(targetDate);
                const badge = targetDate === todayStr ? ' · <b>Σήμερα</b>' : '';

                topHtml = `
                    <div class="weather-current" onclick="toggleForecast()">
                        <div class="weather-left">
                            <span class="weather-icon">${icon}</span>
                            <div>
                                <div style="font-size:0.72rem;font-weight:700;opacity:0.9">${label}${badge}</div>
                                <div class="weather-desc">${desc}</div>
                            </div>
                        </div>
                        <div class="weather-mid">
                            <span style="font-size:0.8rem;font-weight:800">↑${max}° / ↓${min}°</span>
                            <span>💧${rain}% · 💨${wind} km/h</span>
                        </div>
                        <div class="weather-right">
                            <button id="weatherRefreshBtn" class="weather-refresh"
                                    onclick="event.stopPropagation();fetchWeather()" title="Ανανέωση">🔄</button>
                            <span class="weather-toggle ${weatherOpen?'open':''}" id="weatherToggleArrow">▼</span>
                        </div>
                    </div>`;

            } else {
                // Ημερομηνία εκτός εύρους πρόβλεψης
                topHtml = `
                    <div class="weather-current" style="cursor:default">
                        <div class="weather-left">
                            <span class="weather-icon">📅</span>
                            <div>
                                <div style="font-size:0.8rem;font-weight:700">Πρόβλεψη μη διαθέσιμη</div>
                                <div style="font-size:0.67rem;opacity:0.7">για ${targetDate}</div>
                            </div>
                        </div>
                        <button id="weatherRefreshBtn" class="weather-refresh" onclick="fetchWeather()">🔄</button>
                    </div>`;
            }

            // ── Εκτεταμένη λωρίδα: ΟΛΕΣ οι μέρες ταξιδιού (εμφανίζεται όταν ανοίξει) ──
            let forecastRows = '';
            times.forEach((dateStr, i) => {
                if (!isTripDay(dateStr)) return;
                const [fi]  = wmo(d.weather_code?.[i] ?? 0);
                const max   = d.temperature_2m_max?.[i] != null ? Math.round(d.temperature_2m_max[i]) : '—';
                const min   = d.temperature_2m_min?.[i] != null ? Math.round(d.temperature_2m_min[i]) : '—';
                const rain  = d.precipitation_probability_max?.[i] ?? 0;
                const isActive = dateStr === targetDate;  // highlight επιλεγμένης μέρας
                const label    = tripDayLabel(dateStr).split(' ');
                forecastRows += `
                    <div class="forecast-day ${isActive ? 'today' : ''}">
                        <span class="forecast-dayname">${label[0]}</span>
                        <span class="forecast-date">${label[1]}</span>
                        <span class="forecast-icon">${fi}</span>
                        <span class="forecast-max">${max}°</span>
                        <span class="forecast-min">${min}°</span>
                        <span class="forecast-rain">💧${rain}%</span>
                    </div>`;
            });

            document.getElementById('weatherBar').innerHTML = `
                ${topHtml}
                <div class="weather-forecast ${weatherOpen?'open':''}" id="weatherForecast">
                    <div class="forecast-grid">${forecastRows ||
                        '<div style="opacity:.7;font-size:.75rem;padding:4px">Δεν βρέθηκαν δεδομένα για 11–17/5</div>'
                    }</div>
                    <div class="weather-footer">
                        <span>📍 St. Julian's · Open-Meteo ECMWF</span>
                        <span>⏱ ${fmtTime(now)} · ανανέωση/30'</span>
                    </div>
                </div>`;
        }

        function toggleForecast() {
            weatherOpen = !weatherOpen;
            const fc    = document.getElementById('weatherForecast');
            const arrow = document.getElementById('weatherToggleArrow');
            if (fc) fc.classList.toggle('open', weatherOpen);
            if (arrow) arrow.classList.toggle('open', weatherOpen);
        }

        // Αρχική φόρτωση + timer κάθε 30 λεπτά
        fetchWeather();
        refreshTimer = setInterval(fetchWeather, REFRESH_MS);

    </script>
</body>
</html>
