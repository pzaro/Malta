          {

            "cost": "~€40.00",

          {

            "category": "🏛️ Αξιοθέατα",
            "name": "Sliema Promenade & Roman Baths",

            "tip": "Η κοσμοπολίτικη όψη της Μάλτας, ακριβώς δίπλα σας.",
            "cost": "Δωρεάν",
            "description": "📖 Τοποθεσία:\nΗ Sliema συνορεύει με το St. Julian's. Ο παραλιακός δρόμος τους ενώνεται. Στα βράχια υπάρχουν τα 'Roman Baths', φυσικές πισίνες από τη βικτωριανή εποχή.\n\n🎙️ Tip Δούση:\n'Τελευταία μέρα χαλάρωσης. Δεν χρειάζεστε λεωφορείο. Ξεκινήστε να περπατάτε τον παραλιακό πεζόδρομο από το ξενοδοχείο σας προς τη Sliema. Κατεβείτε στα λαξευμένα βράχια για να δείτε τα Roman Baths. Αν έχει ζέστη, είναι το τέλειο σημείο για βουτιά! Μπορείτε να κάνετε και τα τελευταία σας ψώνια στο εμπορικό The Point.'"
          },
          {

          {

            "time": "05:30",
            "category": "🚌 Μεταφορές",
            "name": "Αναχώρηση: The Londoner ➔ Αεροδρόμιο",
            "distance": "Πτήση FR7131 στις 08:05",
            "tip": "ΠΡΟΣΟΧΗ: Κλείστε BOLT! Η πτήση είναι πολύ νωρίς.",
            "cost": "~€15-20 (Bolt/eCabs)",
            "description": "📖 Πρακτική Ανάλυση:\nΗ πτήση σας είναι στις 08:05, που σημαίνει ότι πρέπει να είστε στο αεροδρόμιο (MLA) το αργότερο στις 06:15. Το λεωφορείο TD2 ξεκινάει τα δρομολόγια συνήθως μετά τις 04:30-05:00, αλλά ΔΕΝ είναι απόλυτα αξιόπιστο για τόσο πρωινές πτήσεις και κάνει στάσεις.\n\n🎙️ Tip Δούση:\n'Φίλοι μου, ακούστε με προσεκτικά για να μην χάσετε την πτήση! Ξεχάστε τα λεωφορεία για την επιστροφή. Κατεβάστε την εφαρμογή Bolt ή την τοπική eCabs από την προηγούμενη μέρα (μπορείτε να κάνετε και προ-κράτηση). Καλέστε το ταξί για τις 05:30 - 05:40 το πρωί έξω από το The Londoner Hotel. Η διαδρομή χωρίς κίνηση θα πάρει 20 λεπτά. Θα δώσετε περίπου 15-20 ευρώ, αλλά θα φτάσετε κύριοι, με απόλυτη ηρεμία στο αεροδρόμιο. Καλό ταξίδι επιστροφής στη Θεσσαλονίκη!'"
          }
        ];

        let currentDisplayData = [];
        let currentDay = 0;
        let currentCat = 'all';
        let currentTextToSpeak = "";
        const synth = window.speechSynthesis;

        const removeAccents = (str) => {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
        };

        render();

        function filterData(type, value) {
            if (type === 'day') {
                currentDay = value;
                document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
            } else {
                currentCat = value;
                document.querySelectorAll('.btn-filter:not(.date-btn)').forEach(b => b.classList.remove('active'));
            }
            event.target.classList.add('active');
            render();
        }

        function render() {
            const container = document.getElementById('content');
            container.innerHTML = '';

            currentDisplayData = allData.filter(item => {
                const dayMatch = currentDay === 0 || (item.days && item.days.includes(currentDay));
                let catMatch = true;
                
                if (currentCat !== 'all') {
                    const itemCatClean = removeAccents(item.category);
                    const searchCatClean = removeAccents(currentCat);
                    catMatch = itemCatClean.includes(searchCatClean);
                }
                
                return dayMatch && catMatch;
            });

            if (currentDisplayData.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:#777;">Κενό Πρόγραμμα! Χαλαρώστε στο St. Julian\'s! 🍹</div>';
                return;
            }

            currentDisplayData.forEach((item, index) => {
                const distanceHtml = item.distance ? `<span class="distance-tag">👣 Από Βάση/Προηγούμενο: <b>${item.distance}</b></span>` : '';
                const searchQuery = encodeURIComponent(item.name + " Malta");
                const realMapUrl = `https://www.google.com/maps/search/?api=1&query=Dal+Moro's+Fresh+Pasta+to+Go+Venice3{searchQuery}`;

                container.innerHTML += `
                    <div class="card">
                        <div class="category-tag">${item.category}</div>
                        <div class="name">${item.name}</div>
                        ${distanceHtml}
                        <div class="meta-info">
                            <span class="time-badge">🕒 ${item.time || '-'}</span>
                            <span class="cost-badge">💰 ${item.cost}</span>
                        </div>
                        <div class="tip">💡 ${item.tip}</div>
                        <div class="card-actions">
                            <button class="action-btn info-btn" onclick="openModal(${index})">ℹ️ Πλήρης Ανάλυση</button>
                            <a href="${realMapUrl}" target="_blank" class="action-btn map-btn">📍 Χάρτης</a>
                        </div>
                    </div>
                `;
            });
        }

        function openModal(index) {
            const item = currentDisplayData[index];
            if (!item) return;
            document.getElementById('modalTitle').innerText = item.name;
            document.getElementById('modalBody').innerText = item.description || item.tip;
            
            // Clean text for speech synthesis
            let cleanText = (item.description || item.tip).replace(/\]+\]/g, '');
            currentTextToSpeak = cleanText.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '');
            
            document.getElementById('infoModal').style.display = 'flex';
            stopSpeaking();
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
            stopSpeaking();
        }

        function startSpeaking() {
            if (synth.speaking) return;
            if (currentTextToSpeak) {
                const utterThis = new SpeechSynthesisUtterance(currentTextToSpeak);
                utterThis.lang = 'el-GR';
                utterThis.rate = 0.95;
                utterThis.onend = () => toggleAudioButtons(false);
                synth.speak(utterThis);
                toggleAudioButtons(true);
            }
        }

        function stopSpeaking() {
            if (synth.speaking) synth.cancel();
            toggleAudioButtons(false);
        }

        function toggleAudioButtons(isSpeaking) {
            document.getElementById('speakBtn').style.display = isSpeaking ? 'none' : 'block';
            document.getElementById('stopBtn').style.display = isSpeaking ? 'block' : 'none';
        }
    </script>
