<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Malta Mediterranean Guide</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; background: #fdf6e3; color: #2c3e50; margin: 0; padding-bottom: 60px; }
    .header { background: #fff; position: sticky; top: 0; z-index: 900; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 10px 0; border-bottom: 3px solid #d4af37; }
    h1 { text-align: center; color: #2c3e50; margin: 5px 0; font-size: 1.3rem; font-family: Georgia, serif; }
    .sub { text-align: center; margin: 0 15px 10px; font-size: 0.9rem; color: #666; }
    .filters-wrapper { display: flex; flex-direction: column; gap: 8px; margin-top: 5px; }
    .scroll-container { display: flex; overflow-x: auto; gap: 8px; padding: 0 15px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .scroll-container::-webkit-scrollbar { display: none; }
    .btn-filter { flex: 0 0 auto; padding: 8px 15px; border-radius: 20px; border: 1px solid #d4af37; background: #fff; font-size: 0.85rem; color: #555; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .btn-filter.active { background: #d4af37; color: white; border-color: #d4af37; }
    .date-btn.active { background: #2c3e50; border-color: #2c3e50; }
    .container { max-width: 600px; margin: 0 auto; padding: 15px; }
    .card { background: white; border-radius: 6px; padding: 15px; margin-bottom: 15px; border-left: 5px solid #d4af37; box-shadow: 0 3px 6px rgba(0,0,0,0.08); }
    .category-tag { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #d4af37; letter-spacing: 1px; }
    .name { font-size: 1.25rem; font-weight: 800; margin: 5px 0; color: #2c3e50; font-family: Georgia, serif; }
    .distance-tag { font-size: 0.9rem; color: #555; display: inline-block; margin-bottom: 5px; background: #eee; padding: 3px 8px; border-radius: 4px; }
    .meta-info { display: flex; gap: 10px; margin-top: 8px; font-size: 0.9rem; flex-wrap: wrap; }
    .time-badge { background: #2c3e50; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
    .cost-badge { background: #eafaf1; color: #27ae60; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
    .tip { background: #fcf3cf; color: #555; padding: 10px; border-radius: 4px; margin-top: 10px; font-style: italic; font-size: 0.95rem; border-left: 3px solid #f1c40f; }
    .card-actions { display: flex; gap: 10px; margin-top: 15px; }
    .action-btn { flex: 1; padding: 12px; border-radius: 4px; text-align: center; font-weight: bold; text-decoration: none; font-size: 0.9rem; cursor: pointer; border: none; text-transform: uppercase; letter-spacing: 0.5px; }
    .map-btn { background: white; color: #2c3e50; border: 1px solid #2c3e50; }
    .info-btn { background: #2c3e50; color: white; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .empty { text-align:center; padding:20px; color:#777; }
    .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:2000; align-items:flex-end; justify-content:center; }
    .modal-content { background:white; width:100%; max-width:600px; border-radius:15px 15px 0 0; padding:25px; max-height:85vh; overflow-y:auto; animation:slideUp 0.3s ease-out; }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:10px; }
    .modal-title { font-size:1.4rem; font-weight:bold; color:#2c3e50; margin:0; font-family:Georgia, serif; }
    .close-btn { background:none; border:none; font-size:2rem; color:#888; cursor:pointer; }
    .modal-body { font-size:1.05rem; line-height:1.6; color:#333; white-space:pre-line; }
    .audio-controls { margin-top:20px; display:flex; gap:10px; border-top:1px solid #eee; padding-top:15px; }
    .speak-btn { background:#d4af37; color:white; width:100%; border-radius:8px; padding:12px; font-weight:bold; border:none; }
    .stop-btn { background:#c0392b; color:white; display:none; width:100%; border-radius:8px; padding:12px; font-weight:bold; border:none; }
    @keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
  </style>
</head>
<body>
  <div class="header">
    <h1>Malta Mediterranean Guide</h1>
    <p class="sub">St. Julian’s base • beaches • food • entertainment • day trips</p>
    <div class="filters-wrapper">
      <div class="scroll-container" id="dayFilters"></div>
      <div class="scroll-container" id="catFilters"></div>
    </div>
  </div>

  <div class="container" id="content"></div>

  <div id="infoModal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title"></h2>
        <button class="close-btn" onclick="closeModal()">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div class="audio-controls">
        <button id="speakBtn" class="speak-btn" onclick="startSpeaking()">Speak</button>
        <button id="stopBtn" class="stop-btn" onclick="stopSpeaking()">Stop</button>
      </div>
    </div>
  </div>

<script>
const allData = [
  { days: 1, time: "Flexible", category: "Entertainment", name: "Spinola Bay", distance: "Near hotel", tip: "Sunset walk, cafes, boats.", cost: "-", description: "Classic St. Julian's waterfront and one of the best first stops." },
  { days: 1, time: "Flexible", category: "Entertainment", name: "Paceville", distance: "Near hotel", tip: "Bars, clubs, nightlife.", cost: "-", description: "Main nightlife district of St. Julian's." },
  { days: 1, time: "Flexible", category: "Beaches", name: "St George's Bay", distance: "5 min walk", tip: "Easy swim and beach time.", cost: "-", description: "Closest beach to your hotel and a simple first-day option." },
  { days: 1, time: "Evening", category: "Food", name: "Salumeria Gardens", distance: "St. Julian's", tip: "Pizza, beers, relaxed dinner.", cost: "15-25", description: "Good casual place for a meal near your base." },

  { days: 2, time: "Morning", category: "Views", name: "Valletta", distance: "Bus/Ferry", tip: "UNESCO capital, walk the old streets.", cost: "-", description: "Historic capital of Malta with strong views and architecture." },
  { days: 2, time: "Lunch", category: "Food", name: "Pastizzi Stop", distance: "Valletta or Rabat", tip: "Try ricotta and pea pastries.", cost: "2-5", description: "Classic Maltese street food." },
  { days: 2, time: "Afternoon", category: "Entertainment", name: "Upper Barrakka Gardens", distance: "Valletta", tip: "Great harbor panorama.", cost: "-", description: "Perfect for a short scenic stop." },

  { days: 3, time: "Morning", category: "Beaches", name: "Golden Bay", distance: "Northwest Malta", tip: "Big sandy beach.", cost: "-", description: "One of Malta's most famous beaches." },
  { days: 3, time: "Afternoon", category: "Beaches", name: "Għajn Tuffieħa", distance: "Near Golden Bay", tip: "More scenic and quieter.", cost: "-", description: "Dramatic scenery and a great sunset beach." },
  { days: 3, time: "Lunch", category: "Food", name: "Fish lunch near Mellieħa", distance: "North Malta", tip: "Seafood and local dishes.", cost: "20-35", description: "Good day-trip lunch option by the coast." },

  { days: 4, time: "Morning", category: "Views", name: "Mdina", distance: "Bus 202/202B", tip: "Silent City, best early.", cost: "-", description: "Top historic inland visit in Malta." },
  { days: 4, time: "Lunch", category: "Food", name: "Fontanella Tea Garden", distance: "Mdina", tip: "Cake with panorama.", cost: "8-15", description: "Very popular for views and desserts." },
  { days: 4, time: "Afternoon", category: "Entertainment", name: "Crystal Palace Is-Serkin", distance: "Rabat", tip: "Pastizzi stop.", cost: "2-5", description: "Simple and famous local snack stop." },

  { days: 5, time: "Morning", category: "Views", name: "Blue Grotto", distance: "South Malta", tip: "Boat if sea is calm.", cost: "-", description: "Famous sea caves and blue water views." },
  { days: 5, time: "Afternoon", category: "Food", name: "Marsaxlokk", distance: "Bus 119", tip: "Seafood and harbor walk.", cost: "-", description: "Great for fish lunch and harbor photos." },
  { days: 5, time: "Evening", category: "Entertainment", name: "Strait Street", distance: "Valletta", tip: "Bars and cocktails.", cost: "10-15", description: "One of the best evening areas in Valletta." },

  { days: 6, time: "Morning", category: "Entertainment", name: "Gozo Day Trip", distance: "Ferry", tip: "Best full-day excursion.", cost: "-", description: "Island trip with villages and viewpoints." },
  { days: 6, time: "Afternoon", category: "Beaches", name: "Ramla Bay", distance: "Gozo", tip: "Red sand beach.", cost: "-", description: "One of Gozo's most beautiful beaches." },
  { days: 6, time: "Lunch", category: "Food", name: "Ta Rikardu", distance: "Victoria, Gozo", tip: "Gbejniet and local food.", cost: "20-30", description: "Traditional Gozo food experience." },

  { days: 7, time: "Flexible", category: "Food", name: "Ta' Marija", distance: "Mosta", tip: "Traditional Maltese dinner.", cost: "25-40", description: "Very good for authentic Maltese food." },
  { days: 7, time: "Flexible", category: "Entertainment", name: "Dragonara Casino", distance: "St. Julian's", tip: "Evening option near hotel.", cost: "-", description: "Close entertainment choice in your base area." },
  { days: 7, time: "Flexible", category: "Entertainment", name: "Portomaso Marina", distance: "St. Julian's", tip: "Luxury walk and views.", cost: "-", description: "Nice for a calm walk, coffee, or marina photos." }
];

const days = ["All Days", "Day 1", "Day 2", "Day 3", "Day 4", "Day 5", "Day 6", "Day 7"];
const cats = ["All", "Entertainment", "Beaches", "Food", "Views"];

let currentDay = 0;
let currentCat = "All";
let currentDisplayData = [];
let currentTextToSpeak = "";
const synth = window.speechSynthesis;

function removeAccents(str) {
  return (str || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

function renderFilters() {
  const dayWrap = document.getElementById("dayFilters");
  const catWrap = document.getElementById("catFilters");

  dayWrap.innerHTML = days.map((d, i) =>
    `<button class="btn-filter date-btn ${i === 0 ? "active" : ""}" onclick="filterData('day', ${i})">${d}</button>`
  ).join("");

  catWrap.innerHTML = cats.map((c, i) =>
    `<button class="btn-filter ${i === 0 ? "active" : ""}" onclick="filterData('cat', '${c}')">${c}</button>`
  ).join("");
}

function filterData(type, value) {
  if (type === "day") {
    currentDay = value;
    document.querySelectorAll(".date-btn").forEach(b => b.classList.remove("active"));
    event.target.classList.add("active");
  } else {
    currentCat = value;
    document.querySelectorAll(".btn-filter").forEach(b => {
      if (!b.classList.contains("date-btn")) b.classList.remove("active");
    });
    event.target.classList.add("active");
  }
  render();
}

function getMapUrl(name) {
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(name + " Malta");
}

function render() {
  const container = document.getElementById("content");
  currentDisplayData = allData.filter(item => {
    const dayMatch = currentDay === 0 || item.days === currentDay;
    const catMatch = currentCat === "All" || removeAccents(item.category).includes(removeAccents(currentCat));
    return dayMatch && catMatch;
  });

  if (currentDisplayData.length === 0) {
    container.innerHTML = `<div class="empty">No items found.</div>`;
    return;
  }

  container.innerHTML = currentDisplayData.map((item, index) => `
    <div class="card">
      <div class="category-tag">${item.category}</div>
      <div class="name">${item.name}</div>
      <div class="distance-tag">${item.distance || ""}</div>
      <div class="meta-info">
        <span class="time-badge">${item.time}</span>
        <span class="cost-badge">${item.cost}</span>
      </div>
      <div class="tip">${item.tip}</div>
      <div class="card-actions">
        <button class="action-btn info-btn" onclick="openModal(${index})">Info</button>
        <a class="action-btn map-btn" href="${getMapUrl(item.name)}" target="_blank">Map</a>
      </div>
    </div>
  `).join("");
}

function openModal(index) {
  const item = currentDisplayData[index];
  if (!item) return;
  document.getElementById("modalTitle").innerText = item.name;
  document.getElementById("modalBody").innerText = item.description + "\n\nTip: " + item.tip;
  currentTextToSpeak = (item.description + " " + item.tip).replace(/[^\w\s\u0370-\u03FF\u1F00-\u1FFF]/g, "");
  document.getElementById("infoModal").style.display = "flex";
  stopSpeaking();
}

function closeModal() {
  document.getElementById("infoModal").style.display = "none";
  stopSpeaking();
}

function toggleAudioButtons(isSpeaking) {
  document.getElementById("speakBtn").style.display = isSpeaking ? "none" : "block";
  document.getElementById("stopBtn").style.display = isSpeaking ? "block" : "none";
}

function startSpeaking() {
  if (synth.speaking) return;
  if (currentTextToSpeak) {
    const utterThis = new SpeechSynthesisUtterance(currentTextToSpeak);
    utterThis.lang = "el-GR";
    utterThis.rate = 0.95;
    utterThis.onend = () => toggleAudioButtons(false);
    synth.speak(utterThis);
    toggleAudioButtons(true);
  }
}

function stopSpeaking() {
  if (synth.speaking) synth.cancel();
  toggleAudioButtons(false);
}

renderFilters();
render();
</script>
</body>
</html>
